version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keeper_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5074:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=keeper_db;Username=postgres;Password=postgres
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: